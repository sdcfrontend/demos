    <div class="wrap">

      <div class="button-wrap">
        <button data-ref="ref:7b2501e4-5553-4741-8acd-8a705eef4ff0">VOD 16/9</button>

    <script>
      document.querySelectorAll('.button-wrap').forEach((button) => {
        button.onclick = (event) => {

          video.switchVideo(event.target.dataset.ref);
        }
      })
    </script>
