<style>.ui-share-button {
  --border: 0;
  --border-radius: 3px;
  --bg: light-dark(#F4F5F7, #252525);
  --color: light-dark(#4A4A4A, #BEBEBE);
  --size: 16px;
  --weight: bold;
  --padding: 0.75em;
  --gap: 0.5em;
  --icon-size: 1em;
  --icon-fill: light-dark(#0162BC, #359CFC);
  --tooltip-bg: green;
  --tooltip-color: white;
  --tooltip-size: 14px;
  line-height: 1;
  position: relative;
  border: var(--border);
  border-radius: var(--border-radius);
  background: var(--bg);
  font: inherit;
  font-weight: var(--weight);
  font-size: var(--size);
  color: var(--color);
  padding: var(--padding);
  gap: var(--gap);
  display: inline-flex;
  align-items: center;
  cursor: pointer;
}

.ui-share-button-tooltip {
  background: var(--tooltip-bg);
  color: var(--tooltip-color);
  font-size: var(--tooltip-size);
  border-radius: var(--border-radius);
  padding: 0.35em 0.5em;
  font-weight: normal;
  position: absolute;
  bottom: 100%;
  left: 50%;
  white-space: nowrap;
  transform: translate(-50%, -5px);
  opacity: 0;
  visibility: hidden;
}

.ui-share-button-tooltip:not(:empty) {
  opacity: 1;
  visibility: visible;
}

.ui-share-button svg {
  display: block;
  width: var(--icon-size);
  fill: var(--icon-fill);
}

@media all and (scripting: none) {
  .ui-share-button-label {
    display: none;
  }
}</style><style>html {
  color-scheme: light dark;
}

body {
  padding: 3em 1em;
}</style></head>
