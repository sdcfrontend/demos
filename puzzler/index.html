<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Document</title>
</head>

<body>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            marrgin: 0;
        }

        html {
            font-family: 'Sky Text';
            color-scheme: light dark;
        }

        html,body {
            background-color: Canvas !important;
        }
    
        .wrap {
            max-width: 1080px;
            padding: 12px min(3.5%, 24px);
            margin: auto;
        }

        #root {
            position: relative;
            border: 1px solid hotpink;
            height: clamp(600px, 100vw, 700px);
        }

        ul {
            display: flex;
            gap: 14px;
            list-style: none;
            flex-wrap: wrap;
        }
    </style>
    <div class="wrap">
        <ul>
            <li><a href="?game=AL">Add a Letter</a></li>
            <li><a href="?game=WL">Word Ladder</a></li>
            <li><a href="?game=SU-EASY">Sudoku</a></li>
            <li><a href="?game=TT">Make Tracks</a></li>
            <li><a href="?game=CD">Totalize</a></li>
        </ul>
        <div id="root" style="position: relative"></div>
    </div>
    <script src="environment-setup.js"></script>
    <script src="pml.js"></script>
    <script>
        const s = new URLSearchParams(location.search);
        const game = (s.get('game') || 'al').toUpperCase();

        const file = 'WL_000103_20240512.json';
        fetch(`./puzzles/${file}`).then((res) => res.json()).then((data) => {
            console.log(data);

            window.pml && window.pml.startGame("root", {
            "scriptPath": "./",
            "autoViewport": true,
            "puzzle": data,
            "eventCallback": function (name, data) { console.log(name, data); } 
        });
        });

        

    </script>
</body>

</html>
